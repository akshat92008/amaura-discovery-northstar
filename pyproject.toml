[project]
name = "amaura-discovery-northstar"
version = "0.1.0"
description = "North BlueStar Algorithmic Discovery Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "rich>=13.0.0",
    "openai>=1.50.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "amaura*",
    "amaura_exec*",
    "north_bluestar*",
    "discovery_kernel*",
    "stage2*",
    "stage3*",
    "stage4*",
]
exclude = [
    "app*",
    "components*",
    "hooks*",
    "lib*",
    "public*",
    "tests*",
    "experiment*",
    "amaura_runs*",
    "benchmark_v1*",
    "stage4_research_decision*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
